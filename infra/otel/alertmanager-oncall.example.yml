global:
  resolve_timeout: 5m

route:
  receiver: cloudctl-oncall
  group_by: [alertname, service, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: cloudctl-oncall
    webhook_configs:
      - url: https://oncall.example.invalid/v1/alerts
        send_resolved: true
