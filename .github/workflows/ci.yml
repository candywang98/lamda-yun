name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,lamda]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: mypy
      - name: Discover PostgreSQL test binaries
        shell: bash
        run: |
          pg_bin="$(pg_config --bindir)" || {
            echo "::error::Cannot locate PostgreSQL test binaries via pg_config --bindir"
            exit 1
          }
          for tool in initdb pg_ctl createdb; do
            test -x "$pg_bin/$tool" || {
              echo "::error::Missing or non-executable PostgreSQL test binary: $pg_bin/$tool"
              exit 1
            }
          done
          for tool in initdb pg_ctl createdb; do
            printf 'PostgreSQL test binary: %s\n' "$pg_bin/$tool"
          done
          printf '%s\n' "$pg_bin" >> "$GITHUB_PATH"
      - id: pytest
        run: pytest -q -rs --basetemp "$RUNNER_TEMP/cloudctl-pytest"
      - run: bash scripts/check-security-boundaries.sh
      - name: Diagnose fleet latency after pytest failure
        if: failure() && steps.pytest.outcome == 'failure'
        timeout-minutes: 5
        run: python -m tests.load.fleet.ci_diagnostics --basetemp "$RUNNER_TEMP/cloudctl-fleet-diagnostic"
      - name: Upload fleet diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cloudctl-pytest/**/load-report-*.json
            ${{ runner.temp }}/cloudctl-fleet-diagnostic/load-report-*.json
            ${{ runner.temp }}/cloudctl-fleet-diagnostic/diagnostic.json
          retention-days: 7
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    env:
      CLOUDCTL_APP_UPDATE_PUBLIC_KEY: ${{ vars.CLOUDCTL_APP_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Require Android release update public key
        shell: bash
        run: |
          if [[ -z "${CLOUDCTL_APP_UPDATE_PUBLIC_KEY:-}" ]]; then
            echo "::error::CLOUDCTL_APP_UPDATE_PUBLIC_KEY repository variable is required for Android release CI."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: cd mobile/companion && ./gradlew verifyReleaseUpdatePublicKey
      - run: cd mobile/companion && ./gradlew lint test
      - run: cd mobile/dpc && ./gradlew lint test
