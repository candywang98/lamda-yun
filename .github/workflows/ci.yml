name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev,lamda]'
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: mypy
      - run: pytest -q
      - run: scripts/check-security-boundaries.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  android:
    runs-on: ubuntu-latest
    env:
      CLOUDCTL_APP_UPDATE_PUBLIC_KEY: ${{ vars.CLOUDCTL_APP_UPDATE_PUBLIC_KEY }}
    steps:
      - name: Require Android release update public key
        shell: bash
        run: |
          if [[ -z "${CLOUDCTL_APP_UPDATE_PUBLIC_KEY:-}" ]]; then
            echo "::error::CLOUDCTL_APP_UPDATE_PUBLIC_KEY repository variable is required for Android release CI."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: cd mobile/companion && ./gradlew verifyReleaseUpdatePublicKey
      - run: cd mobile/companion && ./gradlew lint test
      - run: cd mobile/dpc && ./gradlew lint test
