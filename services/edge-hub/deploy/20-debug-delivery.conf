[Service]
StateDirectory=cloudctl-edge-hub
StateDirectoryMode=0700
ReadWritePaths=/var/lib/cloudctl-edge-hub
ExecStart=
ExecStart=/opt/cloudctl-edge-hub/venv/bin/python -m cloudctl_edge_hub --bind 0.0.0.0:7443 --hub-state-db /var/lib/cloudctl-edge-hub/hub-state.db --server-certificate /etc/cloudctl-edge-hub/tls/server.crt --server-private-key /etc/cloudctl-edge-hub/tls/server.key --client-ca-certificate /etc/cloudctl-edge-hub/tls/client-ca.crt --debug-delivery-db /var/lib/cloudctl-edge-hub/debug-delivery.db --enable-debug-wss --debug-bind 127.0.0.1:17444 --debug-origin http://127.0.0.1:5173 --debug-origin http://localhost:5173 --debug-server-certificate /etc/cloudctl-edge-hub/tls/server.crt --debug-server-private-key /etc/cloudctl-edge-hub/tls/server.key
