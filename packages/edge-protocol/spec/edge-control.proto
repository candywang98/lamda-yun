syntax = "proto3";
package cloudctl.edge.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

service EdgeControl {
  rpc Connect(stream EdgeToCloud) returns (stream CloudToEdge);
  // Control-plane debug grant/revoke delivery over the existing mTLS channel.
  rpc DeliverDebugEvent(DebugEventRequest) returns (DebugEventResponse);
}

message EdgeToCloud {
  uint64 sequence = 1;
  oneof body {
    EdgeHello hello = 10;
    Heartbeat heartbeat = 11;
    CommandAck command_ack = 12;
    TaskEvent task_event = 13;
    EvidenceReady evidence_ready = 14;
    ConfirmationRequired confirmation_required = 15;
    OperatorAction operator_action = 16;
    ArtifactDeliveryEvent artifact_delivery = 17;
    DebugRelayFrame relay_frame = 18;
  }
}

message CloudToEdge {
  uint64 sequence = 1;
  oneof body {
    CloudHello hello = 10;
    StartCommand start = 11;
    CancelCommand cancel = 12;
    DebugSessionGrant debug_grant = 13;
    CertificateRevocationUpdate revocations = 14;
    ConfirmationResolution confirmation_resolution = 15;
    DebugSessionRevoke debug_revoke = 16;
    DebugRelayFrame relay_frame = 17;
  }
}

message EdgeHello {
  string edge_id = 1;
  string software_version = 2;
  uint64 last_cloud_sequence_acked = 3;
}
message CloudHello { uint64 last_edge_sequence_acked = 1; }
message Heartbeat {
  string edge_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  repeated DeviceHealth devices = 3;
}
message DeviceHealth {
  string device_id = 1;
  string state = 2;
  string android_version = 3;
  string lamda_version = 4;
  map<string,string> app_versions = 5;
  google.protobuf.Struct capabilities = 6;
  int32 battery_percent = 7;
  bool charging = 8;
  string network_type = 9;
  float temperature_celsius = 10;
  int64 free_storage_bytes = 11;
  string companion_version = 12;
  string current_task_run_id = 13;
  string current_task_state = 14;
  bool automation_stopped = 15;
}
message StartCommand {
  string command_id = 1;
  string task_run_id = 2;
  string device_id = 3;
  string lease_id = 4;
  uint64 fencing_token = 5;
  google.protobuf.Timestamp deadline = 6;
  string command_type = 7;
  google.protobuf.Struct payload = 8;
  repeated ArtifactRef artifacts = 9;
}
message ArtifactRef {
  string object_key = 1;
  string sha256 = 2;
  int64 size = 3;
  string kind = 4; // APK, APK_SPLIT, MEDIA, AUTOMATION_PACKAGE
  string content_type = 5;
  string file_name = 6;
  string split_name = 7;
  string package_name = 8;
}
message CancelCommand { string command_id = 1; string reason = 2; }
message CommandAck {
  string command_id = 1;
  string state = 2;
  string error_code = 3;
  string detail = 4;
}
message TaskEvent {
  string command_id = 1;
  string task_run_id = 2;
  string step = 3;
  string state = 4;
  google.protobuf.Timestamp occurred_at = 5;
  google.protobuf.Struct attributes = 6;
}
message EvidenceReady {
  string command_id = 1;
  string evidence_id = 2;
  string kind = 3;
  string sha256 = 4;
  int64 size = 5;
}
message ConfirmationRequired {
  string confirmation_id = 1;
  string command_id = 2;
  string task_run_id = 3;
  string device_id = 4;
  string title = 5;
  string detail = 6;
  string risk_level = 7;
  google.protobuf.Timestamp expires_at = 8;
}
message OperatorAction {
  string action_id = 1;
  string device_id = 2;
  string command_id = 3;
  string confirmation_id = 4;
  string action = 5; // CONFIRM, REJECT, STOP_AUTOMATION
  google.protobuf.Timestamp occurred_at = 6;
}
message ArtifactDeliveryEvent {
  string command_id = 1;
  string task_run_id = 2;
  string device_id = 3;
  ArtifactRef artifact = 4;
  string state = 5; // QUEUED, DOWNLOADING, VERIFIED, DELIVERED, FAILED
  int64 bytes_received = 6;
  string error_code = 7;
  google.protobuf.Timestamp occurred_at = 8;
}
message DebugSessionGrant {
  string session_id = 1;
  string device_id = 2;
  google.protobuf.Timestamp expires_at = 3;
  repeated string capabilities = 4;
  string lease_id = 5;
  uint64 fencing_token = 6;
  // Sensitive bearer; never include this value in audit or log payloads.
  string relay_token = 7;
}
message CertificateRevocationUpdate { repeated string revoked_fingerprints = 1; }
message ConfirmationResolution {
  string confirmation_id = 1;
  string command_id = 2;
  bool approved = 3;
  string actor_id = 4;
  google.protobuf.Timestamp decided_at = 5;
}
message DebugSessionRevoke {
  string session_id = 1;
  string device_id = 2;
  string reason = 3;
}

message DebugEventRequest {
  string event_id = 1;
  string tenant_id = 2;
  string aggregate_id = 3;
  string event_type = 4;
  google.protobuf.Timestamp occurred_at = 5;
  google.protobuf.Struct payload = 6;
}
message DebugEventResponse {
  bool accepted = 1;
  string detail = 2;
}

// A bounded, application-level relay frame. This is not a raw socket/ADB
// tunnel: receivers validate session, capability and fixed message kind.
message DebugRelayFrame {
  string session_id = 1;
  string request_id = 2;
  string capability = 3;
  string kind = 4;
  bytes payload = 5;
  bool end = 6;
  string device_id = 7;
}
