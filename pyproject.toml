[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloudctl"
version = "0.1.0"
description = "LAMDA cloud control system"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "boto3==1.43.83",
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "grpcio==1.83.1",
  "protobuf==7.36.0",
  "httpx==0.28.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "prometheus-client==0.26.0",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "sqlalchemy[asyncio]==2.0.52",
  "temporalio==1.32.0",
  "uvicorn[standard]==0.52.4",
  "websockets==17.1"
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "grpcio-tools==1.83.1",
  "mypy==2.3.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "PyYAML==6.0.3",
  "ruff==0.16.5"
]
lamda = ["lamda==10.8"]

[tool.hatch.build.targets.wheel]
packages = [
  "packages/domain/src/cloudctl_domain",
  "packages/edge-protocol/src/cloudctl_edge_protocol",
  "packages/lamda-driver/src/cloudctl_lamda_driver",
  "packages/automation-sdk/src/cloudctl_automation_sdk",
  "packages/observability/src/cloudctl_observability",
  "services/control-api/src/cloudctl_api",
  "services/temporal-worker/src/cloudctl_worker",
  "services/edge-hub/src/cloudctl_edge_hub",
  "services/outbox-dispatcher/src/cloudctl_outbox",
  "edge/gateway/src/cloudctl_edge"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "packages/domain/src",
  "packages/edge-protocol/src",
  "packages/lamda-driver/src",
  "packages/automation-sdk/src",
  "packages/observability/src",
  "services/control-api/src",
  "services/temporal-worker/src",
  "services/edge-hub/src",
  "services/outbox-dispatcher/src",
  "edge/gateway/src"
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "docs/reference",
  "packages/edge-protocol/src/cloudctl_edge_protocol/edge_control_pb2.py",
  "packages/edge-protocol/src/cloudctl_edge_protocol/edge_control_pb2.pyi",
  "packages/edge-protocol/src/cloudctl_edge_protocol/edge_control_pb2_grpc.py"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"services/control-api/src/cloudctl_api/auth.py" = ["B008"]
"tests/edge_*_test.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
  "cloudctl_domain",
  "cloudctl_edge_protocol",
  "cloudctl_lamda_driver",
  "cloudctl_automation_sdk",
  "cloudctl_observability",
  "cloudctl_api",
  "cloudctl_worker",
  "cloudctl_edge_hub",
  "cloudctl_outbox",
  "cloudctl_edge"
]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
extraPaths = [
  "packages/domain/src",
  "packages/edge-protocol/src",
  "packages/lamda-driver/src",
  "packages/automation-sdk/src",
  "packages/observability/src",
  "services/control-api/src",
  "services/temporal-worker/src",
  "services/edge-hub/src",
  "services/outbox-dispatcher/src",
  "edge/gateway/src"
]
include = [
  "packages/domain/src",
  "packages/edge-protocol/src",
  "packages/lamda-driver/src",
  "packages/automation-sdk/src",
  "packages/observability/src",
  "services/control-api/src",
  "services/temporal-worker/src",
  "services/edge-hub/src",
  "services/outbox-dispatcher/src",
  "edge/gateway/src"
]
exclude = [
  ".venv",
  "**/node_modules",
  "**/dist",
  "packages/edge-protocol/src/cloudctl_edge_protocol/edge_control_pb2.py",
  "packages/edge-protocol/src/cloudctl_edge_protocol/edge_control_pb2_grpc.py"
]
